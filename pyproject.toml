[project]
name = "jst-export"
version = "0.1.0"
description = "聚水潭 ERP 销售出库单定时自动导出"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
jst-export = "jst_export.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jst_export"]